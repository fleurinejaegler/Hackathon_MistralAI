<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Know Your Building</title>
<meta name="theme-color" content="#F04A00">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect width='26' height='26' rx='7' fill='%23F04A00'/%3E%3Cpath fill='%23fff' fill-rule='evenodd' d='M9 4h8v19H9zM11 7v4h4V7zM11 13v4h4v-4z'/%3E%3C/svg%3E">
<meta name="description" content="City records and tenant voices for any San Francisco address.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{
  /* Golden Gate Bridge International Orange: C0 M69 Y100 K6 (goldengate.org) */
  --bridge:#F04A00; --bridge-strong:#C93D00; --bridge-tint:#FFF1E9;
  /* Slate, fog and tints from the SF.gov design system */
  --bg:#fff; --fog:#EFF3F4; --fog-soft:#F6F8F9; --ink:#1C3E57; --muted:#4F6E84; --line:#DFE6E9;
  --city:#1F6BA0; --city-tint:#EDF4F7;
  --voice:#6B4FA6; --voice-tint:#EDEBF6;
  --people:#007A61; --people-tint:#E9F7EC;
  --green:#1B674D; --green-tint:#E9F7EC; --amber:#7A5B00; --amber-tint:#F8F1DF; --amber-fill:#E7B22E; --red:#A61C28; --red-tint:#FBE9EA;
  --sans:"Rubik",-apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --wrap:1040px; --radius:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:600;letter-spacing:-.02em;line-height:1.18}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bridge-strong);outline-offset:2px;border-radius:6px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
.muted{color:var(--muted)}
.small{font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border:1px solid var(--bridge-strong);border-radius:10px;background:var(--bridge-strong);color:#fff;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:#B33600;border-color:#B33600}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--fog-soft);border-color:var(--line)}
.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

.mockbar{background:var(--amber-tint);color:var(--amber);font-size:13px;text-align:center;padding:5px 16px}
.bar{background:#fff;border-top:3px solid var(--bridge);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;min-height:60px;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;cursor:pointer;font-weight:600;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{flex:none}
.barsearch{flex:1;display:flex;gap:8px;max-width:420px;margin-left:auto}
.barsearch input{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--fog-soft);padding:0 14px}
.barsearch button{height:40px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 14px;font-weight:500;cursor:pointer}
.barsearch button:hover{background:var(--fog-soft)}
.lang{margin-left:auto;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 8px;cursor:pointer}
.barsearch + .lang{margin-left:0}

/* landing: the bridge coming out of the fog */
.hero-band{position:relative;overflow:hidden;background:linear-gradient(180deg,#E7EEF2 0%,#F2F6F7 58%,#fff 100%)}
.hero-art{position:absolute;bottom:0;right:max(-130px,calc(50% - 570px));height:100%;aspect-ratio:1000/620;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34%,#000 90%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 34%,#000 90%,transparent 100%)}
.hero{position:relative;z-index:1;padding-top:clamp(56px,10vh,96px);padding-bottom:clamp(84px,13vh,128px)}
.hero-copy{max-width:540px}
.hero h1{font-size:clamp(36px,4.9vw,54px);letter-spacing:-.03em;line-height:1.07}
.bigsearch{display:flex;gap:8px;margin-top:28px;padding:7px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px rgba(28,62,87,.1)}
.bigsearch:focus-within{border-color:var(--bridge-strong)}
.bigsearch input{flex:1;min-width:0;border:0;background:transparent;padding:10px 12px;font-size:17px}
.bigsearch input:focus{outline:none}
.bigsearch input::placeholder{color:var(--muted)}
.bigsearch button{border:0;background:var(--bridge-strong);color:#fff;border-radius:10px;padding:0 22px;font-weight:500;cursor:pointer}
.bigsearch button:hover{background:#B33600}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.chip-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;min-height:34px}
.chip-btn:hover{border-color:var(--muted)}
.lease-link{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:0;border:0;background:none;color:var(--ink);font-weight:500;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.lease-link svg.ic{width:18px;height:18px}
.features{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:28px;margin-bottom:56px}
.feature{padding:18px;border-radius:var(--radius);background:var(--tint)}
.feature .fi{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:#fff;color:var(--c)}
.feature .ft{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.18;margin-top:12px}
.feature .fd{display:block;font-size:14px;color:var(--muted);margin-top:3px;line-height:1.35}
.feature-btn{display:block;width:100%;border:1px solid transparent;color:inherit;text-align:left;cursor:pointer}
.feature-btn:hover{border-color:var(--amber)}
.t-report{--c:var(--bridge-strong);--tint:var(--bridge-tint)}
.t-city{--c:var(--city);--tint:var(--city-tint)}
.t-voices{--c:var(--voice);--tint:var(--voice-tint)}
.t-people{--c:var(--people);--tint:var(--people-tint)}
.t-lease{--c:var(--amber);--tint:var(--amber-tint)}

/* states */
.state{min-height:56vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:56px 0}
.state h1{font-size:clamp(26px,4vw,36px)}
.state .summary{color:var(--muted)}
.steps{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:8px;font-size:15px;text-align:left}
.steps li{color:#9DB0BD;display:flex;gap:10px;align-items:center}
.steps li::before{content:"";width:10px;height:10px;border:1.5px solid currentColor;border-radius:50%}
.steps li.on{color:var(--ink)}
.steps li.on::before{border-color:var(--bridge);border-right-color:transparent;animation:spin .8s linear infinite}
.steps li.done{color:var(--green)}
.steps li.done::before{background:currentColor}
@keyframes spin{to{transform:rotate(360deg)}}

/* result header and main tabs */
.addr-band{background:var(--fog-soft)}
.addr{padding-top:26px;padding-bottom:16px}
.addr h1{font-size:clamp(26px,3.6vw,36px);letter-spacing:-.025em;overflow-wrap:anywhere}
.addr .meta{color:var(--muted);font-size:15px;margin-top:2px}
.mainnav{position:sticky;top:0;z-index:900;background:var(--fog-soft);border-bottom:1px solid var(--line)}
.mainnav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.mainnav button{display:flex;align-items:center;gap:8px;background:none;border:0;border-bottom:3px solid transparent;padding:11px 10px 10px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.mainnav button:hover{color:var(--ink)}
.mainnav button[aria-current=page]{color:var(--c);border-bottom-color:var(--c)}
.panel{padding-top:24px;padding-bottom:48px}

/* report: AI text on the left, official data on the right */
.ai-card{padding:20px 22px 8px;border:1px solid var(--line);border-radius:var(--radius)}
.verdict-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.verdict{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px 4px 10px;font-size:14px;font-weight:500}
.lv-green{color:var(--green);background:var(--green-tint)} .lv-orange{color:var(--amber);background:var(--amber-tint)} .lv-red{color:var(--red);background:var(--red-tint)} .lv-low{color:var(--city);background:var(--city-tint)}
.meter{display:flex;gap:4px;width:96px}
.meter i{flex:1;height:6px;border-radius:3px;background:var(--fog)}
.meter .on-green{background:#2E9B6A}
.meter .on-orange{background:var(--amber-fill)}
.meter .on-red{background:#D9434E}
h2.headline{font-size:clamp(22px,2.7vw,27px);margin:12px 0 8px}
.summary{max-width:40em;color:#34566E}
.signals{margin-top:16px;border-top:1px solid var(--line)}
.signal,.fold{border-bottom:1px solid var(--line)}
.fold:last-child{border-bottom:0}
.signal summary,.fold summary{display:flex;align-items:center;gap:11px;padding:11px 0;cursor:pointer;list-style:none;font-weight:500}
.signal summary::-webkit-details-marker,.fold summary::-webkit-details-marker{display:none}
.signal summary>.grow,.fold summary>.grow{flex:1;min-width:0}
.chev{width:16px;height:16px;flex:none;color:var(--muted);transition:transform .15s}
details[open]>summary .chev{transform:rotate(180deg)}
.dot{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px}
.sig-body{padding:0 0 14px 35px;font-size:15px;color:#34566E}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;line-height:1.3;border:0;border-radius:6px;padding:3px 8px;text-decoration:none}
.sig-body .tag{margin-top:7px}
.tag.city{background:var(--city-tint);color:var(--city)}
.tag.voice{background:var(--voice-tint);color:var(--voice)}
.tag.people{background:var(--people-tint);color:var(--people)}
.tag.fict{background:var(--fog);color:var(--muted)}
.tag.ok{background:var(--green-tint);color:var(--green)}
a.tag:hover,button.tag:hover{text-decoration:underline}
button.tag{cursor:pointer}
.fold-body{padding:0 0 14px}
.fold-body ol{margin:0 0 10px;padding-left:20px;font-size:15px}
.fold-body li{margin:5px 0}
.legal{margin-top:12px;font-size:13px;line-height:1.4;color:var(--muted)}
.official{margin-top:16px;padding:16px;background:var(--city-tint);border-radius:var(--radius)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:12px}
.stat{display:block;text-align:left;background:#fff;border:1px solid transparent;border-radius:11px;padding:11px 12px;cursor:pointer}
.stat:hover{border-color:var(--city)}
.stat b{display:block;font-size:25px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.stat span{display:block;font-size:13px;color:var(--muted);line-height:1.25;margin-top:3px}
.stat.alert{background:var(--red-tint)}
.stat.alert:hover{border-color:var(--red)}
.stat.alert b{color:var(--red)}
.stat.alert span{color:var(--red)}
.facts{margin:14px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:0;font-weight:500}
.rentnote{margin-top:12px;font-size:13.5px;color:var(--city);line-height:1.35}

/* city records */
.flag{display:inline-block;font-size:13px;font-weight:500;line-height:1.3;border-radius:6px;padding:4px 9px}
.flag.ai{background:var(--bridge-tint);color:var(--bridge-strong)}
.flag.city{background:var(--city-tint);color:var(--city)}
.official .flag.city{background:#fff}
.flag.voice{background:var(--voice-tint);color:var(--voice)}
.flag.people{background:var(--people-tint);color:var(--people)}
.flag.block{display:block;width:fit-content;margin:14px 0 2px;background:var(--amber-tint);color:var(--amber)}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px 0 8px}
.subtabs button{flex:none;display:flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:500;font-size:14.5px;cursor:pointer;min-height:38px;color:var(--muted)}
.subtabs button:hover{background:var(--fog-soft)}
.subtabs button[aria-selected=true]{background:var(--city-tint);border-color:transparent;color:var(--city)}
.subtabs i{font-style:normal;opacity:.75;font-size:13px}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:110px 1fr auto;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.rows time{font-size:14px;line-height:1.7;color:var(--muted)}
.rows small{display:block;color:var(--muted);font-size:13.5px;margin-top:1px}
.status{font-size:12.5px;font-weight:500;line-height:1.3;padding:3px 8px;border-radius:6px;background:var(--fog);color:var(--muted);white-space:nowrap}
.status.open{background:var(--red-tint);color:var(--red)}
.unsafe{display:inline-block;font-size:12.5px;font-weight:500;color:var(--red);background:var(--red-tint);padding:2px 7px;border-radius:6px;margin-top:4px}
.empty{padding:16px 0;color:var(--muted)}
.bars{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:11px;max-width:640px}
.bars .lab{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.bars b{font-weight:500}
.track{height:6px;background:var(--city-tint);border-radius:3px;margin-top:4px}
.fill{height:100%;background:var(--city);border-radius:3px;opacity:.8}
.source{display:inline-block;margin-top:14px;font-size:13px;color:var(--muted)}
.more{margin-top:12px}
.renttable{width:100%;max-width:640px;border-collapse:collapse;margin-top:6px}
.renttable th{font-size:13px;font-weight:400;text-align:left;color:var(--muted);padding:6px 0}
.renttable td{padding:10px 0;border-top:1px solid var(--line)}

/* reviews and people */
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.avg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start;margin-bottom:18px}
.avg .bars{margin:0;gap:8px}
.avg .big{font-size:46px;font-weight:600;line-height:1;letter-spacing:-.03em;color:var(--voice)}
.avg .big small{font-size:18px;font-weight:400;color:var(--muted);letter-spacing:0}
.bars.voiced .track{background:var(--voice-tint)}
.bars.voiced .fill{background:var(--voice)}
.tv{padding:14px 16px;background:var(--voice-tint);border-radius:var(--radius);margin-bottom:6px}
.tv b{display:block;font-size:13px;font-weight:500;color:var(--voice);margin-bottom:2px}
.review{padding:16px 0;border-bottom:1px solid var(--line)}
.review header{display:flex;flex-wrap:wrap;gap:5px 9px;align-items:center}
.review header b{font-weight:500}
.review blockquote{margin:7px 0}
.stars{color:var(--amber-fill);letter-spacing:1px;font-size:15px}
.stars .off{color:var(--line)}
.people-grid{display:grid;gap:16px}
.card{padding:20px;border:1px solid var(--line);border-radius:var(--radius)}
.card h3{display:flex;align-items:center;gap:9px;font-size:18px}
.card h3 svg{color:var(--people)}
.card>p.small{margin-top:3px}
.person{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;align-items:flex-start;margin-top:12px}
.person+.person{margin-top:0}
.person:last-child{padding-bottom:0}
.person b{font-weight:500}
.person p{font-size:15px;margin-top:5px}
.person .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.score{font-size:20px;font-weight:600;color:var(--people);line-height:1.1}
.life{font-size:13.5px;color:var(--muted)}
.right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>.btn{margin-top:14px}
.me{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px;margin-bottom:14px}

footer{padding-top:18px;padding-bottom:30px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}

/* dialog */
dialog{width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);border:0;border-radius:16px;padding:0;background:#fff;color:var(--ink);box-shadow:0 20px 60px rgba(28,62,87,.25)}
dialog::backdrop{background:rgba(28,62,87,.38)}
.dlg{padding:24px}
.dlg h2{font-size:22px;padding-right:44px}
.dlg .close{position:absolute;right:12px;top:12px;width:40px;height:40px;border:0;border-radius:50%;background:none;cursor:pointer;font-size:22px;color:var(--muted)}
.dlg .close:hover{background:var(--fog-soft)}
.field{display:block;margin-top:14px}
.field>span,fieldset legend{display:block;font-weight:500;font-size:14px;margin-bottom:5px;padding:0}
fieldset{border:0;padding:0;margin:0}
.field input:not([type=checkbox]),.field select,.field textarea{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 11px}
.field textarea{min-height:100px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:flex-start;gap:9px;margin-top:12px;font-size:15px}
.check input{margin-top:4px;width:17px;height:17px;flex:none;accent-color:var(--bridge-strong)}
.rate{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;flex-wrap:wrap}
.rate legend{float:left;margin:0;font-weight:400;font-size:15px}
.rate .opts{display:flex;gap:5px;margin-left:auto}
.rate label{position:relative}
.rate input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.rate span{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:9px;font-size:14px}
.rate input:checked+span{background:var(--voice);border-color:var(--voice);color:#fff}
.rate input:focus-visible+span{outline:2px solid var(--voice);outline-offset:2px}
.privacy{margin-top:14px;padding:10px 12px;background:var(--green-tint);color:var(--green);border-radius:10px;font-size:13.5px}
.formerr{margin-top:14px;padding:10px 12px;background:var(--red-tint);color:var(--red);border-radius:10px;font-size:14px}
.formactions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:3000;max-width:calc(100vw - 32px);background:var(--ink);color:#fff;border-radius:10px;padding:11px 16px;font-size:14.5px;box-shadow:0 8px 24px rgba(28,62,87,.25)}
.toast:empty{display:none}

@media (max-width:1040px){
  .features{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:860px){
  .features{grid-template-columns:1fr 1fr}
  .feature-btn{grid-column:1/-1}
  .hero-copy{max-width:470px}
}
@media (max-width:700px){
  /* phones: the bridge sits under the search, the tabs move to the thumb */
  .hero{padding-top:36px;padding-bottom:190px}
  .hero-copy{max-width:none}
  .hero-art{height:212px;right:calc(50% - 215px);
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18%,#000 88%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 18%,#000 88%,transparent 100%)}
}
@media (max-width:620px){
  .wrap{padding-left:16px;padding-right:16px}
  .bar .wrap{flex-wrap:wrap;gap:8px 10px;min-height:0}
  .barsearch{order:3;flex:1 0 100%;max-width:none}
  .lang,.barsearch + .lang{margin-left:auto}
  .bigsearch{flex-direction:column}
  .bigsearch button{min-height:44px}
  .features{margin-bottom:40px;gap:10px}
  .feature{padding:14px}
  .ai-card{padding:16px 16px 6px}
  .rows li{grid-template-columns:1fr auto;gap:2px 12px}
  .rows li time{grid-column:1/-1}
  .two{grid-template-columns:1fr}
  .dlg{padding:20px 16px}
  .person .btn{width:100%}
}

/* map */
.map-section{margin-top:4px}
.map-head{padding-bottom:12px}
.map-head h2{font-size:clamp(22px,2.6vw,28px)}
.map-slot{height:clamp(440px,72vh,780px);border-block:1px solid var(--line)}
#mapstage{position:relative;width:100%;height:100%;background:var(--fog);overflow:hidden}
#bigmap{position:absolute;inset:0}
.map-top{position:absolute;left:12px;top:12px;right:58px;z-index:2;display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none}
.metrics{display:flex;gap:2px;max-width:100%;padding:4px;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(28,62,87,.18);overflow-x:auto;scrollbar-width:none;pointer-events:auto}
.metrics button{flex:none;min-height:36px;padding:6px 12px;border:0;border-radius:9px;background:none;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer}
.metrics button:hover{color:var(--ink)}
.metrics button[aria-pressed=true]{background:var(--bridge-tint);color:var(--bridge-strong)}
.map-hint{max-width:100%;padding:4px 10px;background:rgba(255,255,255,.94);border-radius:8px;box-shadow:0 1px 6px rgba(28,62,87,.14);color:var(--ink);font-size:13px;line-height:1.35}
.map-hint:empty{display:none}
.map-hint.err{background:var(--red-tint);color:var(--red);pointer-events:auto}
.map-hint .link{color:inherit;margin-left:4px}
.map-legend{position:absolute;left:12px;bottom:12px;z-index:2;max-width:calc(100% - 24px);padding:9px 12px 8px;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(28,62,87,.18);font-size:12.5px;line-height:1.3}
.map-legend:empty{display:none}
.lg-title{font-weight:500;margin-bottom:6px}
.lg-scale{display:flex;gap:5px}
.lg-item{flex:1 1 auto;min-width:34px}
.lg-item i{display:block;height:8px;border-radius:2px}
.lg-item small{display:block;margin-top:3px;color:var(--muted);font-size:11.5px;white-space:nowrap}
.map-tip{position:absolute;left:0;top:0;z-index:3;max-width:300px;padding:5px 9px;background:var(--ink);border-radius:8px;color:#fff;font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.map-tip[hidden]{display:none}
.map-tip b{font-weight:600}
.map-off{position:absolute;inset:0;z-index:4;display:grid;place-items:center;padding:24px;background:var(--fog);color:var(--muted);text-align:center}
.pin{width:20px;height:20px;background:var(--bridge);border:3px solid #fff;border-radius:50%;box-shadow:0 1px 6px rgba(28,62,87,.5)}
.maplibregl-map{font-family:var(--sans)}
.maplibregl-popup-content{padding:14px 16px;border-radius:14px;box-shadow:0 8px 28px rgba(28,62,87,.24);color:var(--ink)}
.maplibregl-popup-close-button{width:30px;height:30px;font-size:20px;color:var(--muted);border-radius:0 14px 0 8px}
.map-pop h3{padding-right:20px;font-size:16px}
.pop-note{margin-top:2px;color:var(--muted);font-size:12.5px}
.pop-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 12px}
.pop-stats b{display:block;font-size:20px;font-weight:600;line-height:1.1}
.pop-stats span{display:block;margin-top:2px;color:var(--muted);font-size:12px;line-height:1.2}
.map-pop .btn{width:100%;min-height:40px}
.map-fab{display:none}

/* lease */
.lease-drop{position:relative;display:block;padding:30px 20px;background:var(--fog-soft);border:1.5px dashed #B8C6CF;border-radius:var(--radius);text-align:center;cursor:pointer}
.lease-drop:hover,.lease-drop.over{background:var(--bridge-tint);border-color:var(--bridge-strong)}
.lease-drop:focus-within{outline:2px solid var(--bridge-strong);outline-offset:2px}
.lease-drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.lease-drop .fi{display:inline-grid;place-items:center;width:44px;height:44px;margin-bottom:10px;background:#fff;border-radius:12px;color:var(--amber)}
.lease-drop b{display:block;font-size:17px;font-weight:600}
.lease-drop small{display:block;margin-top:3px;color:var(--muted);font-size:14px}
.lease-foot{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:center;margin-top:12px;font-size:13.5px;color:var(--muted)}
.lease-foot .link{color:var(--ink);font-weight:500;font-size:14.5px}
.lease-wait{display:flex;gap:14px;align-items:center;padding:26px 20px;background:var(--fog-soft);border-radius:var(--radius)}
.lease-wait b{font-weight:500}
.lease-wait p{overflow-wrap:anywhere}
.spin{flex:none;width:24px;height:24px;border:2.5px solid var(--bridge);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
.lease-head h3{font-size:21px}
.lease-file{margin-top:2px;color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.lease-counts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lease-fake{margin-top:12px;padding:10px 12px;background:var(--amber-tint);border-radius:10px;color:var(--amber);font-size:14px}
.clauses{margin-top:14px;border-bottom:1px solid var(--line)}
.clause{padding:14px 0;border-top:1px solid var(--line)}
.clause header{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.clause .verdict{padding:2px 10px 2px 8px;font-size:13px}
.clause h4{margin:8px 0 0;font-size:16px;font-weight:500;line-height:1.35}
.clause blockquote{margin:6px 0 0;padding-left:10px;border-left:3px solid var(--line);color:var(--muted);font-size:14.5px;overflow-wrap:anywhere}
.lease-ok{display:flex;gap:10px;align-items:flex-start;padding:16px;background:var(--green-tint);border-radius:var(--radius)}
.lease-ok b{display:block;font-weight:500}
.lease-ok p{margin-top:2px;font-size:14px}
.lease-done .btn{margin-top:14px}

/* results: the report beside the map */
@media (min-width:901px){
  body.has-split{height:100dvh;overflow:hidden;display:flex;flex-direction:column}
  body.has-split #app{flex:1;min-height:0}
  .has-split .bar .wrap{max-width:none}
  .split{display:grid;grid-template-columns:max(440px,min(46vw,720px)) minmax(0,1fr);height:100%}
  .split-left{height:100%;overflow-y:auto;border-right:1px solid var(--line)}
  .split-left .wrap{max-width:none}
  .split-right{height:100%}
}
@media (max-width:900px){
  .split-right{display:none}
  body.map-open .split-right{display:block;position:fixed;top:0;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:850}
  .map-fab{display:inline-flex;align-items:center;gap:7px;position:fixed;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:860;height:44px;padding:0 15px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-weight:500;box-shadow:0 6px 18px rgba(28,62,87,.32);cursor:pointer}
  body.map-open .map-fab{bottom:calc(136px + env(safe-area-inset-bottom))}
  .mainnav{position:fixed;left:0;right:0;bottom:0;top:auto;background:#fff;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 18px rgba(28,62,87,.08)}
  .mainnav .wrap{gap:0;padding:0}
  .mainnav button{flex:1 1 0;min-width:0;flex-direction:column;gap:3px;padding:8px 2px 8px;margin:0;border-bottom:0;border-top:3px solid transparent;font-size:12.5px;white-space:normal;line-height:1.15;text-align:center}
  .mainnav button[aria-current=page]{border-top-color:var(--c)}
  .panel{padding-top:18px;padding-bottom:28px}
  .has-tabs footer{padding-bottom:calc(128px + env(safe-area-inset-bottom))}
  .has-tabs .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}
@media (max-width:440px){
  .avg{grid-template-columns:minmax(0,1fr);gap:12px}
  .map-top{right:50px}
}
@media (prefers-reduced-motion:reduce){.steps li.on::before,.spin{animation:none}.chev{transition:none}}
</style>

/* =========================== state & helpers =========================== */
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const state = {
  lang: LANGS[qs.get("lang")] ? qs.get("lang") : (LANGS[store.get("kyb_lang")] ? store.get("kyb_lang") : "en"),
  view:"landing", address:"", data:null, error:null, section:validSection(qs.get("tab")), mapOpen:false, lease:{status:"idle"}, tab:"c", showAll:{},
  profile:store.get("kyb_profile"), matches:null, sent:{}, pendingContact:null, reqId:0
};
const $ = (s,el=document)=>el.querySelector(s);
const t = (k,v)=>{let s=(I18N[state.lang]&&I18N[state.lang][k])??I18N.en[k]??k; if(v) for(const n in v) s=s.replace("{"+n+"}",v[n]); return s};
const esc = v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u=>/^https?:\/\//i.test(u||"")?u:null;
const truthy = v=>v===true||/^(y|yes|true|1)$/i.test(String(v??""));
const humanize = s=>{s=String(s??"").replace(/_/g," ").trim();return s?s[0].toUpperCase()+s.slice(1):""};
function fmtDate(s){
  if(!s) return "—";
  const m=String(s).match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/); if(!m) return esc(s);
  const d=new Date(Date.UTC(+m[1],+m[2]-1,+(m[3]||1)));
  const o=m[3]?{year:"numeric",month:"short",day:"numeric",timeZone:"UTC"}:{year:"numeric",month:"short",timeZone:"UTC"};
  return new Intl.DateTimeFormat(LOCALE[state.lang],o).format(d);
}
const money = n=>{const x=Number(n); return n==null||n===""||isNaN(x)?"":new Intl.NumberFormat(LOCALE[state.lang],{style:"currency",currency:"USD",maximumFractionDigits:0}).format(x)};
const num = n=>n==null?"—":esc(n);
const srcLink = id=>`<a class="source" href="https://data.sf.gov/d/${id}" target="_blank" rel="noopener">${t("source")} ↗</a>`;

/* =========================== API =========================== */
async function api(path,opts){
  const res=await fetch(path,opts);
  let body=null; try{body=await res.json()}catch(e){}
  if(!res.ok){const err=new Error((body&&(body.error||body.detail))||"HTTP "+res.status);err.status=res.status;err.hasMsg=!!(body&&(body.error||typeof body.detail==="string"));throw err}
  return body;
}
const mockJson = f=>fetch(new URL("../mocks/"+f,location.href)).then(r=>{if(!r.ok)throw new Error(f);return r.json()});
async function getReport(address,lang,point){
  if(MOCK){
    const [building,report,community]=await Promise.all([mockJson("mock_building.json"),mockJson("mock_report.json"),mockJson("mock_community.json")]);
    await new Promise(r=>setTimeout(r,500));
    building.query_address=address;
    if(point){building.lat=point.lat;building.lon=point.lon;building.blklot=point.blklot||building.blklot;building.matched_address=address.toUpperCase()}
    return {building,report,community};
  }
  return api(`/api/report?address=${encodeURIComponent(address)}&lang=${encodeURIComponent(lang)}`);
}
async function postReview(reviewIn,proof){
  if(MOCK){
    await new Promise(r=>setTimeout(r,500));
    if(/\b(idiot|stupid)\b/i.test(reviewIn.text)) return {status:"rejected",verified:false,reason:"Mock moderation rejected this text."};
    return {status:"published",verified:!!proof,reason:""};
  }
  const fd=new FormData(); fd.append("review",JSON.stringify(reviewIn)); if(proof) fd.append("proof",proof);
  return api("/api/reviews",{method:"POST",body:fd});
}
async function postProfile(p){
  if(MOCK) return {...p,id:"mock-me",verified:false,demo:false};
  return api("/api/profiles",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});
}
async function postLease(file){
  if(MOCK){
    await new Promise(r=>setTimeout(r,700));
    return mockJson("lease.json");
  }
  const fd=new FormData(); fd.append("file",file);
  return api("/api/lease",{method:"POST",body:fd});
}
const getMatches = id=>MOCK?mockJson("mock_roommates.json"):api(`/api/roommates?profile_id=${encodeURIComponent(id)}`);
async function postContact(b){
  if(MOCK) return {ok:true};
  return api("/api/contact",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
}

const bridgeArt=(()=>{
  /* A tower of the Golden Gate Bridge rising out of the fog, in International Orange. */
  const tx=690,top=54,deck=430,lo=150,loY=396,vx=1150,vy=404,end=1000,x0=tx-38,x1=tx+38;
  const a=(loY-top)/((x0-lo)**2),b=(vy-top)/((vx-x1)**2);
  let hangers="";
  for(let x=-120;x<x0-4;x+=15) hangers+=`M${x} ${(loY-a*(x-lo)**2).toFixed(1)}V${deck}`;

function leaseInner(){

async function analyzeLease(file){
  if(!file) return;
  const okType=/^(application\/pdf|image\/(png|jpeg|webp))$/.test(file.type)||/\.(pdf|png|jpe?g|webp)$/i.test(file.name);
  if(!okType||file.size>LEASE_MAX_BYTES){
    leaseReq++;
    state.lease={status:"idle",error:t(okType?"lease_big":"lease_type")};
    renderLease();
    return;
  }
  const id=++leaseReq;
  state.lease={status:"loading",file:file.name};
  renderLease();
  try{
    const res=await postLease(file);
    if(id!==leaseReq) return;
    const clauses=Array.isArray(res&&res.clauses)?res.clauses:[];
    state.lease=res&&res.error&&!clauses.length?{status:"idle",error:res.error}:{status:"done",file:file.name,clauses,fake:!!(res&&res._mock)};
  }catch(e){
    if(id!==leaseReq) return;
    state.lease={status:"idle",error:errMsg(e)};
  }
  renderLease();
}
async function tryLeaseSample(){
  try{
    const r=await fetch("samples/demo_lease_bad_clauses.pdf");
    if(!r.ok) throw new Error(r.status);
    const blob=await r.blob();
    analyzeLease(new File([blob],"demo_lease_bad_clauses.pdf",{type:"application/pdf"}));
  }catch(e){
    state.lease={status:"idle",error:t("generic_err")};
    renderLease();
  }
}

/* =========================== map ===========================
   Neighborhoods, then blocks, then building footprints as you zoom in, colored by a
   count over the same 10 years and with the same parcel matching as backend/data.py.
   Geometry for neighborhoods and blocks is static (frontend/tools/build_map_data.py);
   counts and parcels come live from DataSF. */
const MapView=(()=>{
  const DATASF="https://data.sf.gov/resource/";
  const DS={parcels:"acdm-wktn",c:"gm2e-bten",v:"nbtm-fbw5",e:"5cei-gny5"};
  const STYLE="https://tiles.openfreemap.org/styles/positron";
  const CITY=[[-122.515,37.705],[-122.355,37.835]];
  const LIMIT=[[-122.72,37.62],[-122.18,37.92]];
  const Z_BLOCK=13.2, Z_PARCEL=16.1, Z_LOAD=15.7, MAX_BLOCKS=160, MAX_HULL_KM2=1.6;
  const SINCE=new Date(Date.now()-3650*864e5).toISOString().slice(0,10);
  const METRICS=[{k:"c",label:"st_c"},{k:"v",label:"st_v"},{k:"e",label:"tab_e"}];
  const RAMP=["#FDE3D4","#FBB78F","#F48A4E","#D9500F","#8F2C00"], ZERO="#E7ECEF", INK="#1C3E57";
  const BINS={
    c:{nh:[1,1000,2500,5000,7500],blk:[1,10,25,50,100],par:[1,2,4,8,16]},
    v:{nh:[1,300,800,1200,2000],blk:[1,5,10,20,50],par:[1,2,3,5,10]},
    e:{nh:[1,100,250,500,1000],face:[1,2,4,8,20]}
  };
  let map=null, stage=null, tried=false, ready=false, failed=false, pending=0, metric="c";
  let selected=null, marker=null, popup=null, hovered=null, shownLevel=null, rebuildTimer=null, hoodBoxes=new Map();
  let queue=[], nhFC=null, blkFC=null, blockIndex=[], blockById=new Map(), eviFC={type:"FeatureCollection",features:[]}, eviState="idle";
  const fpsByBlock=new Map(), parcelState=new Map(), lotIndex=new Map(), fpById=new Map();
  const lotCounts={c:new Map(),v:new Map()}, lotLoading={c:new Map(),v:new Map()}, totals={c:"idle",v:"idle"};

  const q=s=>String(s).replace(/'/g,"''");
  const inList=ids=>ids.map(i=>`'${q(i)}'`).join(",");
  const pretty=a=>String(a).replace(/\b0(\d(?:ST|ND|RD|TH))\b/,"$1");
  const compact=n=>new Intl.NumberFormat(LOCALE[state.lang],{notation:"compact",maximumFractionDigits:1}).format(n);
  const level=()=>{const z=map.getZoom();return z<Z_BLOCK?"nh":z<Z_PARCEL?"blk":"par"};
  const step=(key,bins)=>["step",["coalesce",["get",key],0],ZERO,...bins.flatMap((b,i)=>[b,RAMP[i]])];
  const chunk=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o};
  const whenReady=fn=>{ready?fn():queue.push(fn)};

  async function soql(ds,params){
    const u=new URL(DATASF+ds+".json");
    Object.entries(params).forEach(([k,v])=>u.searchParams.set("$"+k,v));
    const r=await fetch(u);
    if(!r.ok) throw new Error("DataSF "+r.status);
    return r.json();
  }
  async function tracked(fn){
    pending++; renderHint();
    try{return await fn()}finally{pending--;renderHint()}
  }
  function fail(){failed=true;renderHint()}

  /* ---------- interface ---------- */
  function stageEl(){
    if(stage) return stage;
    stage=document.createElement("div");
    stage.id="mapstage";
    stage.innerHTML=`<div id="bigmap"></div><div class="map-top"><div class="metrics" role="group"></div><div class="map-hint" aria-live="polite"></div></div><div class="map-legend"></div><div class="map-tip" hidden></div>`;
    return stage;
  }
  function metricLabel(){return t(METRICS.find(m=>m.k===metric).label)}
  function legendSpec(){
    if(metric==="e") return level()==="nh"?{bins:BINS.e.nh,by:"map_by_nh"}:{bins:BINS.e.face,by:"map_by_face"};
    const lv=level();
    return {bins:BINS[metric][lv],by:"map_by_"+lv,zero:lv==="par"};
  }
  function renderLegend(){
    const el=stage.querySelector(".map-legend");
    if(!ready){el.innerHTML="";return}
    const {bins,by,zero}=legendSpec();
    const label=(v,i)=>i===bins.length-1?`${compact(v)}+`:(bins[i+1]-1===v?compact(v):`${compact(v)}–${compact(bins[i+1]-1)}`);
    const title=`${metric==="e"?t("st_e"):metricLabel()} ${t(by)} · ${t("tenyears")}`;
    el.innerHTML=`<div class="lg-title">${esc(title)}</div><div class="lg-scale">${zero?`<div class="lg-item"><i style="background:${ZERO}"></i><small>0</small></div>`:""}${bins.map((v,i)=>`<div class="lg-item"><i style="background:${RAMP[i]}"></i><small>${esc(label(v,i))}</small></div>`).join("")}</div>`;
  }
  function renderHint(){
    if(!stage) return;
    const el=stage.querySelector(".map-hint");
    el.classList.toggle("err",failed);
    if(failed){el.innerHTML=`${esc(t("map_error"))} <button class="link" data-a="mapretry">${esc(t("retry"))}</button>`;return}
    if(pending>0||(!ready&&map)){el.textContent=t("map_loading");return}
    if(!map){el.textContent="";return}
    const lv=level();
    el.textContent=lv==="nh"?t("map_hint_nh"):lv==="par"?t("map_hint_par"):metric==="e"?t("map_zoom_in"):t("map_hint_blk");
  }
  function renderUi(){
    if(!stage) return;
    const box=stage.querySelector(".metrics");
    box.setAttribute("aria-label",t("map_title"));
    box.innerHTML=METRICS.map(m=>`<button data-a="metric" data-v="${m.k}" aria-pressed="${m.k===metric}">${esc(t(m.label))}</button>`).join("");
    renderLegend(); renderHint();
    if(map) stage.querySelector("#bigmap").setAttribute("aria-label",`${t("map_title")}: ${metric==="e"?t("st_e"):metricLabel()}`);
  }
  function unavailable(){
    const off=document.createElement("div");
    off.className="map-off";
    off.textContent=t("map_off");
    stage.appendChild(off);
    stage.querySelector(".map-top").hidden=true;
  }

  /* ---------- set up ---------- */
  function init(){
    if(typeof maplibregl==="undefined"){unavailable();return}
    try{
      map=new maplibregl.Map({
        container:stage.querySelector("#bigmap"),style:STYLE,bounds:CITY,fitBoundsOptions:{padding:16},maxBounds:LIMIT,minZoom:10,maxZoom:19,
        attributionControl:false,dragRotate:false,pitchWithRotate:false,
        locale:{"CooperativeGesturesHandler.WindowsHelpText":t("coop_win"),"CooperativeGesturesHandler.MacHelpText":t("coop_mac"),"CooperativeGesturesHandler.MobileHelpText":t("coop_mobile")}
      });
    }catch(e){map=null;unavailable();return}
    map.touchZoomRotate.disableRotation();
    map.keyboard.disableRotation();
    map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
    map.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:'<a href="https://datasf.org/opendata/" target="_blank" rel="noopener">DataSF</a>'}),"bottom-right");
    map.on("load",onLoad);
    map.on("error",()=>{if(!ready&&!map.isStyleLoaded()) fail()});
    map.on("mousemove",onMove);
    map.on("mouseout",clearHover);
    map.on("movestart",hideTip);
    map.on("click",onClick);
    map.on("moveend",sync);
    map.on("zoom",()=>{if(ready&&level()!==shownLevel){shownLevel=level();renderLegend();renderHint()}});
  }
  async function onLoad(){
    failed=false;
    map.setPaintProperty("water","fill-color","#D5E5ED");
    map.setPaintProperty("background","background-color","#F6F7F5");
    map.setPaintProperty("park","fill-color","#E8EEE6");
    try{
      const [hoods,blocks]=await tracked(()=>Promise.all([
        fetch("map-data/neighborhoods.json").then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}),
        fetch("map-data/blocks.json").then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
      ]));
      buildBase(hoods,blocks);
      addLayers();
      ready=true; shownLevel=level();
      applyMetric();
      queue.forEach(fn=>fn()); queue=[];
      sync();
    }catch(e){fail()}
  }
  function hullKm2(ring){
    const kx=111.32*Math.cos(37.77*Math.PI/180), ky=110.57;
    let a=0;
    for(let i=0;i<ring.length-1;i++) a+=ring[i][0]*kx*ring[i+1][1]*ky-ring[i+1][0]*kx*ring[i][1]*ky;
    return Math.abs(a)/2;
  }
  function buildBase(hoods,blocks){
    const [ox,oy]=blocks.origin, s=blocks.scale, features=[];
    blocks.blocks.forEach(([id,nh,c,v,flat])=>{
      const ring=[]; let minX=180,minY=90,maxX=-180,maxY=-90;
      for(let i=0;i<flat.length;i+=2){
        const x=ox+flat[i]/s, y=oy+flat[i+1]/s;
        ring.push([x,y]);
        minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);
      }
      ring.push(ring[0]);
      const entry={id,hood:blocks.neighborhoods[nh],minX,minY,maxX,maxY,c,v};
      blockIndex.push(entry); blockById.set(id,entry);
      if(hullKm2(ring)<=MAX_HULL_KM2) features.push({type:"Feature",properties:{id,c,v},geometry:{type:"Polygon",coordinates:[ring]}});
    });
    blkFC={type:"FeatureCollection",features};
    nhFC=hoods;
    nhFC.features.forEach(f=>{
      f.properties.c=0;f.properties.v=0;f.properties.e=0;
      let minX=180,minY=90,maxX=-180,maxY=-90;
      const walk=n=>{if(typeof n[0]==="number"){minX=Math.min(minX,n[0]);maxX=Math.max(maxX,n[0]);minY=Math.min(minY,n[1]);maxY=Math.max(maxY,n[1])}else n.forEach(walk)};
      walk(f.geometry.coordinates);
      hoodBoxes.set(f.properties.name,[[minX,minY],[maxX,maxY]]);
    });
    sumHoods("c"); sumHoods("v");
  }
  function sumHoods(key){
    const sums=new Map();
    blockIndex.forEach(b=>{if(b.hood) sums.set(b.hood,(sums.get(b.hood)||0)+(b[key]||0))});
    nhFC.features.forEach(f=>{f.properties[key]=sums.get(f.properties.name)||0});
  }
  function addLayers(){
    const before=map.getStyle().layers.find(l=>l.type==="symbol").id;
    const hover=["boolean",["feature-state","hover"],false];
    map.addSource("nh",{type:"geojson",data:nhFC,promoteId:"name"});
    map.addSource("blk",{type:"geojson",data:blkFC,promoteId:"id"});
    map.addSource("par",{type:"geojson",data:{type:"FeatureCollection",features:[]},promoteId:"id"});
    map.addSource("evi",{type:"geojson",data:eviFC,promoteId:"id"});
    map.addSource("nh-names",{type:"geojson",data:{type:"FeatureCollection",features:nhFC.features.map(f=>({type:"Feature",properties:{name:f.properties.name},geometry:{type:"Point",coordinates:[f.properties.lx,f.properties.ly]}}))}});

    map.addLayer({id:"nh-fill",type:"fill",source:"nh",maxzoom:Z_BLOCK+.15,paint:{"fill-color":ZERO,"fill-opacity":["interpolate",["linear"],["zoom"],Z_BLOCK-.4,.84,Z_BLOCK+.1,0]}},before);
    map.addLayer({id:"nh-line",type:"line",source:"nh",maxzoom:Z_BLOCK+.15,paint:{"line-color":["case",hover,INK,"#fff"],"line-width":["case",hover,2.2,1]}},before);
    map.addLayer({id:"blk-fill",type:"fill",source:"blk",minzoom:Z_BLOCK-.45,maxzoom:Z_PARCEL+.15,paint:{"fill-color":ZERO,"fill-opacity":["interpolate",["linear"],["zoom"],Z_BLOCK-.4,0,Z_BLOCK,.88,Z_PARCEL-.2,.88,Z_PARCEL+.1,0]}},before);
    map.addLayer({id:"blk-line",type:"line",source:"blk",minzoom:Z_BLOCK-.2,maxzoom:Z_PARCEL+.15,paint:{"line-color":["case",hover,INK,"#fff"],"line-width":["case",hover,2,.6]}},before);
    map.addLayer({id:"par-fill",type:"fill",source:"par",minzoom:Z_PARCEL-.45,paint:{"fill-color":ZERO,"fill-opacity":["interpolate",["linear"],["zoom"],Z_PARCEL-.4,0,Z_PARCEL,.94]}},before);
    map.addLayer({id:"par-line",type:"line",source:"par",minzoom:Z_PARCEL-.2,paint:{"line-color":["case",hover,INK,"#fff"],"line-width":["case",hover,2.2,.7]}},before);
    map.addLayer({id:"par-sel",type:"line",source:"par",minzoom:Z_PARCEL-.2,filter:["==",["get","id"],""],paint:{"line-color":INK,"line-width":3}},before);
    map.addLayer({id:"evi-dots",type:"circle",source:"evi",minzoom:Z_BLOCK-.2,layout:{"visibility":"none","circle-sort-key":["get","n"]},paint:{
      "circle-color":step("n",BINS.e.face),
      "circle-radius":["interpolate",["linear"],["zoom"],Z_BLOCK,4.5,16,9,18,13],
      "circle-stroke-color":["case",hover,INK,"#fff"],
      "circle-stroke-width":["case",hover,2.2,1.2]
    }});
    map.addLayer({id:"nh-names",type:"symbol",source:"nh-names",maxzoom:Z_BLOCK,layout:{"text-field":["get","name"],"text-font":["Noto Sans Regular"],"text-size":["interpolate",["linear"],["zoom"],11,10,13,12.5],"text-max-width":7,"text-padding":4},paint:{"text-color":INK,"text-halo-color":"rgba(255,255,255,.9)","text-halo-width":1.4}});
    map.setLayerZoomRange("label_other",Z_BLOCK,24);
  }
  function applyMetric(){
    if(!ready) return;
    const isE=metric==="e", show=v=>v?"visible":"none";
    map.setPaintProperty("nh-fill","fill-color",step(metric,BINS[metric].nh));
    map.setLayoutProperty("blk-fill","visibility",show(!isE));
    map.setLayoutProperty("blk-line","visibility",show(!isE));
    map.setLayoutProperty("evi-dots","visibility",show(isE));
    if(!isE){
      map.setPaintProperty("blk-fill","fill-color",step(metric,BINS[metric].blk));
      map.setPaintProperty("par-fill","fill-color",step(metric,BINS[metric].par));
    }else{
      map.setPaintProperty("par-fill","fill-color",ZERO);
    }
    clearHover();
    renderUi();
    if(isE) loadEvictions(); else refreshTotals(metric);
    sync();
  }

  /* ---------- live data ---------- */
  async function refreshTotals(key){
    if(totals[key]!=="idle") return;
    totals[key]="loading";
    try{
      const rows=await soql(DS[key],{select:key==="c"?"block,count(*) as n":"block,count(distinct complaint_number) as n",where:`date_filed>='${SINCE}'`,group:"block",limit:50000});
      const byBlock=new Map(rows.map(r=>[r.block,+r.n]));
      blockIndex.forEach(b=>{b[key]=byBlock.get(b.id)||0});
      blkFC.features.forEach(f=>{f.properties[key]=byBlock.get(f.properties.id)||0});
      sumHoods(key);
      map.getSource("blk").setData(blkFC);
      map.getSource("nh").setData(nhFC);
      totals[key]="done";
    }catch(e){totals[key]="idle"}   // the snapshot stays on screen
  }
  async function loadEvictions(){
    if(eviState!=="idle") return;
    eviState="loading";
    try{
      const rows=await tracked(()=>soql(DS.e,{select:"address,neighborhood,shape,count(*) as n",where:`file_date>='${SINCE}' AND shape IS NOT NULL`,group:"address,neighborhood,shape",limit:50000}));
      const sums=new Map();
      eviFC={type:"FeatureCollection",features:rows.map((r,i)=>{
        if(r.neighborhood) sums.set(r.neighborhood,(sums.get(r.neighborhood)||0)+(+r.n));
        return {type:"Feature",properties:{id:"e"+i,n:+r.n,addr:r.address||""},geometry:r.shape};
      })};
      nhFC.features.forEach(f=>{f.properties.e=sums.get(f.properties.name)||0});
      map.getSource("evi").setData(eviFC);
      map.getSource("nh").setData(nhFC);
      eviState="done";
    }catch(e){eviState="idle";fail()}
  }
  function blocksInView(){
    const b=map.getBounds(), c=b.getCenter();
    const w=b.getWest(), e=b.getEast(), s=b.getSouth(), n=b.getNorth();
    const dist=x=>Math.hypot((x.minX+x.maxX)/2-c.lng,(x.minY+x.maxY)/2-c.lat);
    return blockIndex.filter(x=>x.maxX>=w&&x.minX<=e&&x.maxY>=s&&x.minY<=n).sort((a,d)=>dist(a)-dist(d)).slice(0,MAX_BLOCKS).map(x=>x.id);
  }
  function sync(){
    if(!ready) return;
    renderHint();
    if(map.getZoom()<Z_LOAD) return;
    const ids=blocksInView();
    loadParcels(ids);
    if(metric!=="e") loadLots(metric,ids);
  }
  function bestAddress(rows){
    const seen=new Map();
    rows.forEach(r=>{
      if(!r.from_address_num||r.from_address_num==="0"||!r.street_name) return;
      const text=[r.from_address_num,r.street_name,r.street_type].filter(Boolean).join(" ");
      const e=seen.get(text)||{text,number:r.from_address_num,street:r.street_name,count:0};
      e.count++; seen.set(text,e);
    });
    return [...seen.values()].sort((a,b)=>b.count-a.count||(+a.number)-(+b.number))[0]||null;
  }
  function makeFootprints(block,rows){
    const groups=new Map();
    rows.forEach(r=>{
      if(!r.shape) return;
      const key=JSON.stringify(r.shape.coordinates);
      if(!groups.has(key)) groups.set(key,{shape:r.shape,rows:[]});
      groups.get(key).rows.push(r);
    });
    return [...groups.values()].map(g=>{
      const a=bestAddress(g.rows);
      return {id:g.rows[0].blklot,block,lots:new Set(g.rows.map(r=>r.lot_num)),blklots:g.rows.map(r=>r.blklot),
        number:a?a.number:null,street:a?a.street:"",addr:a?a.text:"",c:null,v:null,geometry:g.shape};
    });
  }
  function assignCounts(block){
    const fps=fpsByBlock.get(block); if(!fps) return;
    ["c","v"].forEach(key=>{
      const rows=lotCounts[key].get(block);
      fps.forEach(fp=>{fp[key]=rows?0:null});
      if(!rows) return;
      rows.forEach(r=>fps.forEach(fp=>{
        if(fp.lots.has(r.lot)||(r.street_number&&r.street_number===fp.number)) fp[key]+=+r.n;
      }));
    });
  }
  function scheduleRebuild(){
    clearTimeout(rebuildTimer);
    rebuildTimer=setTimeout(rebuildParcels,80);
  }
  function rebuildParcels(){
    if(fpsByBlock.size>500){
      const keep=new Set(blocksInView());
      [...fpsByBlock.keys()].forEach(id=>{if(!keep.has(id)&&fpsByBlock.size>350){fpsByBlock.delete(id);parcelState.delete(id)}});
    }
    const features=[];
    lotIndex.clear(); fpById.clear();
    fpsByBlock.forEach(fps=>fps.forEach(fp=>{
      fpById.set(fp.id,fp);
      fp.blklots.forEach(l=>lotIndex.set(l,fp.id));
      features.push({type:"Feature",properties:{id:fp.id,addr:pretty(fp.addr),c:fp.c,v:fp.v},geometry:fp.geometry});
    }));
    map.getSource("par").setData({type:"FeatureCollection",features});
    applySelection();
  }
  function loadParcels(ids){
    const missing=ids.filter(id=>!parcelState.has(id));
    chunk(missing,25).forEach(group=>{
      group.forEach(id=>parcelState.set(id,"loading"));
      tracked(()=>soql(DS.parcels,{select:"blklot,block_num,lot_num,from_address_num,street_name,street_type,simplify(shape,0.00001) as shape",where:`active=true AND block_num in (${inList(group)})`,limit:20000}))
        .then(rows=>{
          const byBlock=new Map();
          rows.forEach(r=>{if(!byBlock.has(r.block_num))byBlock.set(r.block_num,[]);byBlock.get(r.block_num).push(r)});
          group.forEach(id=>{fpsByBlock.set(id,makeFootprints(id,byBlock.get(id)||[]));parcelState.set(id,"done");assignCounts(id)});
          scheduleRebuild();
        })
        .catch(()=>{group.forEach(id=>parcelState.delete(id));fail()});
    });
  }
  function loadLots(key,ids){
    const loading=lotLoading[key], missing=ids.filter(id=>!lotCounts[key].has(id)&&!loading.has(id));
    chunk(missing,40).forEach(group=>{
      const p=tracked(()=>soql(DS[key],{select:key==="c"?"block,lot,street_number,count(*) as n":"block,lot,street_number,count(distinct complaint_number) as n",where:`date_filed>='${SINCE}' AND block in (${inList(group)})`,group:"block,lot,street_number",limit:50000}))
        .then(rows=>{
          const byBlock=new Map(group.map(id=>[id,[]]));
          rows.forEach(r=>{if(byBlock.has(r.block))byBlock.get(r.block).push(r)});
          byBlock.forEach((list,id)=>{lotCounts[key].set(id,list);assignCounts(id)});
          scheduleRebuild();
        })
        .catch(()=>fail())
        .finally(()=>group.forEach(id=>loading.delete(id)));
      group.forEach(id=>loading.set(id,p));
    });
    return Promise.all(ids.map(id=>loading.get(id)).filter(Boolean));
  }

  /* ---------- pointer ---------- */
  function activeLayers(){
    const lv=level();
    if(lv==="nh") return ["nh-fill"];
    if(lv==="blk") return metric==="e"?["evi-dots"]:["blk-fill"];
    return metric==="e"?["evi-dots","par-fill"]:["par-fill"];
  }
  function topFeature(point){return map.queryRenderedFeatures(point,{layers:activeLayers()})[0]||null}
  function hideTip(){const tip=stage.querySelector(".map-tip");tip.hidden=true}
  function clearHover(){
    if(hovered&&map.getSource(hovered.source)) map.removeFeatureState(hovered,"hover");
    hovered=null;
    if(map) map.getCanvas().style.cursor="";
    if(stage) hideTip();
  }
  function tipHtml(f){
    const p=f.properties, name=metric==="e"?"":metricLabel().toLowerCase();
    const row=(n,label,where)=>`<b>${esc(n)}</b> ${esc(label)}${where?` · ${esc(where)}`:""}`;
    if(f.source==="nh") return row(p[metric]??0,metric==="e"?t("st_e").toLowerCase():name,p.name);
    if(f.source==="blk") return row(p[metric]??0,`${name} ${t("map_on_block")}`);
    if(f.source==="evi") return row(p.n,`${t("st_e")} ${t("st_e_scope")}`.toLowerCase(),p.addr);
    if(metric==="e") return esc(p.addr||t("no_address"));
    return row(p[metric]===undefined||p[metric]===null?"…":p[metric],name,p.addr);
  }
  function onMove(e){
    if(!ready) return;
    const f=topFeature(e.point);
    if(!f){clearHover();return}
    if(!hovered||hovered.source!==f.source||hovered.id!==f.id){
      if(hovered&&map.getSource(hovered.source)) map.removeFeatureState(hovered,"hover");
      hovered={source:f.source,id:f.id};
      map.setFeatureState(hovered,{hover:true});
    }
    map.getCanvas().style.cursor="pointer";
    const tip=stage.querySelector(".map-tip");
    tip.innerHTML=tipHtml(f);
    tip.hidden=false;
    const w=stage.clientWidth, h=stage.clientHeight, tw=tip.offsetWidth, th=tip.offsetHeight;
    const x=Math.min(e.point.x+14,w-tw-6), y=e.point.y-th-12<6?e.point.y+16:e.point.y-th-12;
    tip.style.transform=`translate(${Math.max(6,x)}px,${Math.min(y,h-th-6)}px)`;
  }
  function closePopup(){if(popup){popup.remove();popup=null}}
  function showPopup(lngLat,node){
    closePopup();
    popup=new maplibregl.Popup({maxWidth:"290px",offset:10}).setLngLat(lngLat).setDOMContent(node).addTo(map);
  }
  function zoomInto(box,minZoom){
    const cam=map.cameraForBounds(box,{padding:50});
    if(cam) map.flyTo({center:cam.center,zoom:Math.max(cam.zoom,minZoom),speed:1.5});
  }
  function onClick(e){
    if(!ready) return;
    const f=topFeature(e.point);
    if(!f){closePopup();return}
    hideTip();
    if(f.source==="nh"){closePopup();zoomInto(hoodBoxes.get(f.properties.name),Z_BLOCK+.5)}
    else if(f.source==="blk"){
      closePopup();
      const b=blockById.get(f.properties.id);
      zoomInto([[b.minX,b.minY],[b.maxX,b.maxY]],Z_PARCEL+.5);
    }
    else if(f.source==="evi") faceCard(e.lngLat,f.properties);
    else buildingCard(e.lngLat,f.properties.id);
  }
  function faceCard(lngLat,p){
    const node=document.createElement("div");
    node.className="map-pop";
    node.innerHTML=`<h3>${esc(p.addr)}</h3><p class="pop-note"><b>${esc(p.n)}</b> ${esc(`${t("st_e")} ${t("st_e_scope")}`.toLowerCase())} · ${esc(t("tenyears"))}</p>${level()==="par"?"":`<p class="pop-note">${esc(t("map_zoom_in"))}</p>`}`;
    showPopup(lngLat,node);
  }
  function faceCount(fp){
    const n=parseInt(fp.number,10);
    if(!fp.street||isNaN(n)) return Promise.resolve(null);
    const street=fp.street.toUpperCase().replace(/^0(\d)/,"$1"), hundred=Math.floor(n/100)*100;
    return soql(DS.e,{select:"count(*) as n",where:`upper(address) like '${q(hundred+" BLOCK OF "+street)} %' AND file_date>='${SINCE}'`}).then(r=>+((r[0]||{}).n||0)).catch(()=>null);
  }
  function buildingCard(lngLat,id){
    const fp=fpById.get(id); if(!fp) return;
    const node=document.createElement("div");
    node.className="map-pop";
    const stat=(cls,label)=>`<div><b class="${cls}">…</b><span>${esc(label)}</span></div>`;
    if(!fp.addr){node.innerHTML=`<p>${esc(t("no_address"))}</p>`;showPopup(lngLat,node);return}
    node.innerHTML=`<h3>${esc(pretty(fp.addr))}</h3><p class="pop-note">${esc(t("city_flag"))} · ${esc(t("tenyears"))}</p>
      <div class="pop-stats">${stat("pc",t("st_c"))}${stat("pv",t("st_v"))}${stat("pe",`${t("st_e")} ${t("st_e_scope")}`)}</div>
      <button class="btn" data-a="pick" data-v="${esc(fp.addr)}" data-lat="${esc(lngLat.lat)}" data-lon="${esc(lngLat.lng)}" data-b="${esc(fp.id)}">${esc(t("see_report"))}</button>`;
    showPopup(lngLat,node);
    const put=(cls,v)=>{const el=node.querySelector("."+cls);if(el)el.textContent=v===null||v===undefined?"—":v};
    Promise.all([loadLots("c",[fp.block]),loadLots("v",[fp.block])]).then(()=>{
      assignCounts(fp.block);
      const now=(fpsByBlock.get(fp.block)||[]).find(x=>x.id===fp.id)||fp;
      put("pc",now.c); put("pv",now.v);
    });
    faceCount(fp).then(v=>put("pe",v));
  }

  /* ---------- selection ---------- */
  function setMarker(lat,lon){
    if(!map) return;
    if(!marker){
      const el=document.createElement("div");
      el.className="pin";
      marker=new maplibregl.Marker({element:el});
    }
    marker.setLngLat([lon,lat]).addTo(map);
  }
  function applySelection(){
    if(!ready) return;
    const id=selected&&(lotIndex.get(selected.blklot)||"");
    map.setFilter("par-sel",["==",["get","id"],id||""]);
  }

  return {
    mount(slot,{embedded}){
      if(!slot) return;
      const el=stageEl();
      if(el.parentNode!==slot) slot.appendChild(el);
      if(!tried){tried=true;init()}
      renderUi();
      if(!map) return;
      if(embedded) map.cooperativeGestures.enable(); else map.cooperativeGestures.disable();
      requestAnimationFrame(()=>map.resize());
    },
    resize(){if(map) requestAnimationFrame(()=>{map.resize();sync()})},
    setMetric(k){
      if(!METRICS.some(m=>m.k===k)||k===metric) return;
      metric=k;
      closePopup();
      applyMetric();
      const b=stage.querySelector(`.metrics [data-v="${k}"]`); if(b) b.focus();
    },
    mark(p){
      closePopup();
      selected={blklot:p.blklot};
      whenReady(()=>{setMarker(p.lat,p.lon);applySelection()});
    },
    focus(b){
      if(b.lat==null||b.lon==null) return;
      selected={blklot:b.blklot};
      whenReady(()=>{
        setMarker(b.lat,b.lon);
        map.flyTo({center:[b.lon,b.lat],zoom:Math.max(map.getZoom(),Z_PARCEL+.9),speed:1.5});
        applySelection();
      });
    },
    reset(){
      selected=null;
      if(marker) marker.remove();
      closePopup();
      whenReady(()=>{applySelection();map.fitBounds(CITY,{padding:16})});
    },
    retry(){
      if(!ready){location.reload();return}
      failed=false;
      if(metric==="e") loadEvictions();
      sync();
      renderHint();
    }
  };
})();

async function load(address,{silent=false,push=true,point=null}={}){
  const id=++state.reqId;
  if(state.address&&state.address!==address) state.section="report";
  state.address=address;
  if(push&&!silent) pushUrl();
  let timer;
  if(!silent){
    state.mapOpen=false;
    state.view="loading"; render(); window.scrollTo(0,0);
    if(point) MapView.mark(point);
    let i=0; timer=setInterval(()=>{
      const li=document.querySelectorAll("#steps li"); if(!li.length||i>=li.length-1){clearInterval(timer);return}
      li[i].className="done"; li[++i].className="on";
    },1700);
  }
  try{
    const data=await getReport(address,state.lang,point);
    if(id!==state.reqId) return;
    clearInterval(timer);
    state.data=data;
    if(silent){renderPanel();return}
    state.tab="c"; state.showAll={};
    state.view="results"; render();
    MapView.focus(data.building);
    loadMatches();
  }catch(e){
    if(id!==state.reqId) return;
    clearInterval(timer);
    if(silent){toast(t("generic_err"));return}
    state.error=e; state.view="error"; render();
  }
}
async function loadMatches(){
  const me=state.profile;
  if(!me||!(me.role==="seeking_roommate"||me.role==="has_room")) return;
  try{ state.matches=await getMatches(me.id); }
  catch(e){ state.matches=[]; }
  const el=$("#peopleInner"); if(el) el.innerHTML=peopleInner();
}

async function submitReview(form){
  const fd=new FormData(form), ratings={};
  for(const k of RATING_KEYS){const v=fd.get("r_"+k); if(!v){formError(form,t("f_rate_err"));return} ratings[k]=+v}
  const proofFile=fd.get("proof"); const proof=proofFile&&proofFile.size?proofFile:null;
  const reviewIn={blklot:state.data.building.blklot,pseudo:fd.get("pseudo").trim(),period_start:fd.get("period_start"),
    period_end:fd.get("still")||!fd.get("period_end")?null:fd.get("period_end"),ratings,text:fd.get("text").trim()};
  const btn=$("button.voice",form),label=btn.textContent; btn.disabled=true;btn.textContent=t("f_checking");$(".formerr",form).hidden=true;
  try{
    const res=await postReview(reviewIn,proof);
    if(res.status!=="published"){formError(form,t("rejected")+" "+(res.reason||""));return}
    dlg.close(); toast(t(res.verified?"pub_ver":"pub_ok"));
    if(MOCK){
      const c=state.data.community;
      c.reviews.unshift({...reviewIn,id:"mock-"+Date.now(),verified:!!res.verified,status:"published",created_at:new Date().toISOString(),demo:false});
      c.n_reviews=(c.n_reviews||0)+1; if(res.verified)c.n_verified=(c.n_verified||0)+1;
      renderPanel();
    } else load(state.address,{silent:true});
  }catch(e){formError(form,errMsg(e))}
  finally{btn.disabled=false;btn.textContent=label}
}

/* =========================== events =========================== */
document.addEventListener("submit",e=>{
  const f=e.target, k=f.dataset.f; if(!k) return;
  e.preventDefault();
  if(k==="search"){const a=new FormData(f).get("address").trim(); if(a) load(a)}
  else if(k==="review") submitReview(f);
  else if(k==="profile") submitProfile(f);
  else if(k==="contact") submitContact(f);
});
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a, v=el.dataset.v;
  if(a==="home"){state.reqId++;state.view="landing";state.address="";state.data=null;state.section="report";pushUrl();render();MapView.reset();window.scrollTo(0,0)}
  else if(a==="example") load(v);
  else if(a==="retry") load(state.address);
  else if(a==="nav") showSection(v);
  else if(a==="mapopen"){state.mapOpen=!state.mapOpen;syncNav()}
  else if(a==="leaseopen"){openDlg(`<h2>${esc(t("lease_title"))}</h2><div class="lease-inner" style="margin-top:14px">${leaseInner()}</div>`)}
  else if(a==="leasesample") tryLeaseSample();
  else if(a==="leaseagain"){leaseReq++;state.lease={status:"idle"};renderLease()}
  else if(a==="metric") MapView.setMetric(v);
  else if(a==="mapretry") MapView.retry();
  else if(a==="pick") load(v,{point:{lat:+el.dataset.lat,lon:+el.dataset.lon,blklot:el.dataset.b}});
  else if(a==="goto"){state.tab=v;showSection("city")}
  else if(a==="tab"){state.tab=v;$("#records").innerHTML=recordsInner();showSelectedSubtab();$(`#records [data-v="${v}"]`).focus({preventScroll:true})}
  else if(a==="toggleall"){state.showAll[state.tab]=!state.showAll[state.tab];$("#records").innerHTML=recordsInner()}
  else if(a==="copyq"){
    const text=(state.data.report.questions_to_ask_landlord||[]).map((q,i)=>`${i+1}. ${q}`).join("\n");
    (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast(t("copied")),()=>toast(t("generic_err")));
  }
  else if(a==="review") reviewDialog();
  else if(a==="profile"){state.pendingContact=null;profileDialog()}
  else if(a==="contact") contactDialog(v,el.dataset.p);
  else if(a==="close"){state.pendingContact=null;dlg.close()}
  else if(a==="forget"){state.profile=null;state.matches=null;store.set("kyb_profile",null);$("#peopleInner").innerHTML=peopleInner()}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="lang"){
    state.lang=el.value; store.set("kyb_lang",state.lang);
    if(state.address) load(state.address); else {pushUrl();render()}
  } else if(el.dataset.c==="leasefile"){
    analyzeLease(el.files[0]);
  } else if(el.dataset.c==="still"){
    const end=el.form.elements.period_end; end.disabled=el.checked; if(el.checked) end.value="";
  } else if(el.dataset.c==="role"){
    const rm=el.value==="seeking_roommate"||el.value==="has_room";
    $("[data-roommate]",el.form).hidden=!rm;
  }
});
const dropZone=e=>e.target&&e.target.closest?e.target.closest(".lease-drop"):null;
["dragenter","dragover"].forEach(n=>document.addEventListener(n,e=>{const z=dropZone(e);if(z){e.preventDefault();z.classList.add("over")}}));
document.addEventListener("dragleave",e=>{const z=dropZone(e);if(z)z.classList.remove("over")});
document.addEventListener("drop",e=>{const z=dropZone(e);if(z){e.preventDefault();z.classList.remove("over");analyzeLease(e.dataTransfer.files[0])}});
dlg.addEventListener("click",e=>{ if(e.target===dlg){state.pendingContact=null;dlg.close()} });
window.addEventListener("popstate",()=>{
  const q=new URLSearchParams(location.search), a=q.get("address");
  state.address=a||""; state.section=validSection(q.get("tab"));
  if(a) load(a,{push:false}); else {state.reqId++;state.view="landing";state.data=null;render();MapView.reset()}
});

/* =========================== start =========================== */
const initial=qs.get("address");
if(initial) load(initial,{push:false}); else render();
</script>
</body>
</html>
